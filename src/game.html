<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="description" content="Bá Khí: Battle Aura. Game phản xạ nhiều cửa: Gà gáy BÍP thì BỤP. 40 cửa, 5 vùng đất, trùm cuối là Lão Rùa Thiên Tuế.">
<meta property="og:title" content="BÁ KHÍ: Battle Aura 🥊 Gà gáy BÍP thì BỤP">
<meta property="og:description" content="Game phản xạ nhiều cửa. Qua Làng Tre, Chợ Đêm, hạ Lý Trưởng Ngáp và Cáo Anh Hai Hàng Hiệu. Bạn là Tân Thủ Cỏ hay Đế Vương Bụp?">
<meta property="og:type" content="website">
<meta property="og:url" content="__SHARE_URL__">
<meta name="theme-color" content="#0b0b16">
<title>Bá Khí: Battle Aura</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;800;900&display=swap">
<style>
:root{
  --bg:#0b0b16; --fg:#fff; --muted:#a7a8c6; --card:#15172b; --line:#2b2d4a;
  --gold:#ffd23f; --go:#c6ff2e; --bad:#ff2e6e; --ink:#0b0b16;
  --font:'Be Vietnam Pro',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;overflow:auto;z-index:5;
  padding-top:calc(env(safe-area-inset-top,0px) + 20px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen[hidden]{display:none}
.wrap{width:100%;max-width:560px;display:grid;gap:14px;text-align:center}
.logo{font-size:clamp(56px,16vw,110px);font-weight:900;line-height:.9;letter-spacing:-.04em;color:var(--gold);text-shadow:0 6px 0 #a3460f,0 12px 30px rgba(255,140,26,.4)}
.logo small{display:block;font-size:.26em;letter-spacing:.3em;color:#fff;text-shadow:none;margin-top:10px}
.tag{font-size:clamp(16px,4.5vw,20px);font-weight:800;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;cursor:pointer;font:inherit;font-weight:800;font-size:17px;padding:16px 28px;background:#fff;color:var(--ink);min-height:52px;text-decoration:none}
.btn.cta{background:var(--go);font-size:20px;padding:20px 40px;box-shadow:0 0 0 8px rgba(198,255,46,.18)}
.btn.ghost{background:transparent;color:#fff;border:2px solid var(--line)}
.btn[hidden]{display:none}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.row .btn{flex:1 1 170px}
.hero-canvas{width:100%;max-width:560px;height:220px;border-radius:20px;border:1px solid var(--line);image-rendering:pixelated;display:block}
.story[hidden]{display:none}
.story{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:10px;line-height:1.5;font-weight:500}
.story p{margin:0}
/* map */
.rank{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px;text-align:left}
.rank canvas{width:56px;height:72px;image-rendering:pixelated;flex:none}
.rank b{font-size:18px;display:block}.rank span{color:var(--muted);font-size:13px}
.world{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px;text-align:left}
.world h3{margin:0;font-size:20px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 8px}
.world h3 small{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.08em}
.world .mech{font-size:13px;color:var(--muted);margin:0}
.gates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gate{border:0;border-radius:14px;padding:10px 4px;font:inherit;font-weight:900;font-size:20px;background:#22243d;color:#fff;cursor:pointer;display:grid;gap:2px;justify-items:center;min-height:62px}
.gate .st{font-size:11px;letter-spacing:.05em;color:var(--gold);min-height:13px}
.gate.lock{opacity:.38;cursor:not-allowed}
.gate.boss{background:linear-gradient(180deg,#5a1a33,#2a1030);outline:2px solid var(--bad)}
.gate.next{outline:3px solid var(--go);background:#2c3a1a}
.world.closed{opacity:.5}
.banner{background:rgba(255,210,63,.12);border:1px solid rgba(255,210,63,.4);color:var(--gold);border-radius:14px;padding:10px 14px;font-weight:800;font-size:14px}
.heroes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.hero{border:2px solid var(--line);background:#15172b;border-radius:14px;padding:8px 6px;display:grid;grid-template-columns:42px 1fr;align-items:center;justify-items:start;text-align:left;gap:2px 8px;cursor:pointer;font:inherit;color:#fff;font-weight:800;font-size:13px}
.hero canvas{width:42px;height:54px;image-rendering:pixelated;grid-row:span 2}
.hero.on{border-color:var(--go);background:#1f2a14}
.hero.lock{opacity:.45;cursor:not-allowed}
.hero small{font-weight:500;color:var(--muted);font-size:10px;text-align:left;line-height:1.2}
.world.need{opacity:.6}
/* battle hud */
#hud{position:fixed;left:0;right:0;top:0;z-index:4;pointer-events:none;display:grid;gap:6px;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
#hud[hidden]{display:none}
.hud-top{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:13px;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.hud-top button{pointer-events:auto;border:0;background:rgba(0,0,0,.45);color:#fff;font:inherit;font-weight:800;border-radius:999px;padding:6px 12px;cursor:pointer}
.bars{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.bar{height:14px;background:rgba(0,0,0,.5);border-radius:8px;overflow:hidden;border:2px solid rgba(0,0,0,.6)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff2e6e,#ff8c1a);transition:width .25s;border-radius:6px}
.bar.hero i{background:linear-gradient(90deg,#c6ff2e,#5ac54f)}
.hearts{font-size:18px;letter-spacing:2px;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.names{display:flex;justify-content:space-between;font-weight:800;font-size:12px;text-shadow:0 2px 0 rgba(0,0,0,.6)}
#dlg{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
#dlg[hidden]{display:none}
.dlg-box{width:100%;max-width:560px;background:rgba(11,11,22,.92);border:2px solid var(--gold);border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;cursor:pointer}
.dlg-box canvas{width:64px;height:80px;image-rendering:pixelated}
.dlg-box b{color:var(--gold);display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.dlg-box p{margin:4px 0 0;font-weight:500;line-height:1.4;font-size:16px}
.dlg-box small{color:var(--muted);font-size:11px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 90px);transform:translate(-50%,-12px);opacity:0;z-index:9;background:var(--gold);color:var(--ink);font-weight:800;padding:12px 18px;border-radius:12px;max-width:calc(100% - 32px);transition:.25s;pointer-events:none;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#copyarea{position:fixed;left:-9999px;top:0;opacity:0}
/* result */
.res-card{width:100%;max-width:560px;aspect-ratio:3/2;border-radius:20px;image-rendering:pixelated;display:block;border:1px solid var(--line)}
.stars{font-size:40px;letter-spacing:.1em;line-height:1}
.big{font-size:clamp(30px,9vw,46px);font-weight:900;letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
.sub{color:var(--muted);font-weight:500;line-height:1.4}
.hint{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" hidden>
  <div class="hud-top"><span id="hud-gate">Cửa 1</span><button type="button" id="btn-quit">✕ Thoát</button></div>
  <div class="bars">
    <div><div class="names"><span id="hud-hero">Tí Bụp</span></div><div class="hearts" id="hud-hearts">❤️❤️❤️</div></div>
    <div style="font-weight:900">VS</div>
    <div><div class="names"><span></span><span id="hud-enemy">Lính Cỏ</span></div><div class="bar"><i id="hud-ehp" style="width:100%"></i></div></div>
  </div>
</div>

<div id="dlg" hidden><div class="dlg-box" id="dlg-box"><canvas id="dlg-face" width="64" height="80"></canvas><div><b id="dlg-name"></b><p id="dlg-text"></p><small>Chạm để tiếp ▸</small></div></div></div>

<div class="screen" id="s-title">
  <div class="wrap">
    <canvas class="hero-canvas" id="title-canvas" width="560" height="220"></canvas>
    <div class="logo">BÁ KHÍ<small>BATTLE AURA</small></div>
    <div class="tag">Gà gáy BÍP thì BỤP. Chưa gáy mà bụp là ăn đòn.</div>
    <div id="challenge-banner" class="banner" hidden></div>
    <div class="row"><button class="btn cta" id="btn-play" type="button">VÀO GAME</button></div>
    <div class="row"><button class="btn ghost" id="btn-story" type="button">📜 Cốt truyện</button></div>
    <div class="story" id="story" hidden></div>
  </div>
</div>

<div class="screen" id="s-map" hidden>
  <div class="wrap">
    <div class="rank"><canvas id="rank-face" width="56" height="72"></canvas><div><b id="rank-name">🌱 Tân Thủ Cỏ</b><span id="rank-sub">Chưa có dữ liệu phản xạ</span></div></div>
    <div class="heroes" id="heroes"></div>
    <div id="worlds"></div>
    <div class="row"><button class="btn ghost" id="btn-home" type="button">← Về trang chính</button></div>
  </div>
</div>

<div class="screen" id="s-result" hidden>
  <div class="wrap">
    <canvas class="res-card" id="res-card" width="900" height="600"></canvas>
    <div class="stars" id="res-stars"></div>
    <div class="big" id="res-title"></div>
    <div class="sub" id="res-sub"></div>
    <div class="row"><button class="btn cta" id="btn-next" type="button">CỬA TIẾP ▸</button><button class="btn ghost" id="btn-retry" type="button">🔁 Đánh lại</button><button class="btn ghost" id="btn-practice" type="button" hidden>🥋 Luyện tập</button></div>
    <div class="row"><button class="btn" id="btn-share" type="button">📋 Sao chép kết quả</button><a class="btn ghost" id="btn-img" download="ba-khi.png" href="#">🖼️ Lưu ảnh thẻ</a></div>
    <div class="row"><button class="btn ghost" id="btn-link" type="button">🔗 Link thách cửa này</button><a class="btn ghost" id="btn-fb" target="_blank" rel="noopener" href="#">📣 Facebook</a></div>
    <div class="row"><button class="btn ghost" id="btn-map" type="button">🗺️ Bản đồ</button></div>
    <div class="hint">Dán vào Zalo, Messenger, story. Ai mở link thách sẽ nhảy thẳng vào cửa này và phải nhanh hơn bạn.</div>
  </div>
</div>

<div id="toast" role="status"></div>
<textarea id="copyarea" aria-hidden="true" tabindex="-1"></textarea>

<script>/*SPRITES*/</script>
<script>/*WORLD*/</script>
<script>
(function(){
  var SHARE_URL = "__SHARE_URL__";
  var $ = function(id){ return document.getElementById(id); };
  var cv = $('game'), ctx = cv.getContext('2d'), W = 0, H = 0, DPR = 1, GY = 0, SC = 5;
  var save = { unlocked: 1, stars: {}, best: {}, hits: [], hero: 'tibup' };
  try { var s0 = JSON.parse(localStorage.getItem('bakhi.save') || 'null'); if (s0 && s0.stars) { save = s0; if (!save.hero) save.hero = 'tibup'; } } catch (e) {}
  var HERO = HEROES[save.hero] ? save.hero : 'tibup';
  function persist(){ try { localStorage.setItem('bakhi.save', JSON.stringify(save)); } catch (e) {} }
  var challenge = null, m = /^#?c(\d{1,2})-(\d{2,4})$/.exec(location.hash || '');
  if (m && +m[1] >= 1 && +m[1] <= GATES.length) { challenge = { gate: +m[1], ms: +m[2] }; }
  var FF = function(){ return getComputedStyle(document.body).fontFamily; };

  /* ---------- audio ---------- */
  var audio = null;
  function sound(){ try { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); } catch (e) { audio = null; } }
  function tone(f, dur, type, to, vol, delay){ if (!audio) return; try { var o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + (delay || 0); o.type = type || 'square'; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur); g.gain.setValueAtTime(vol || .15, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + dur); } catch (e) {} }
  var SFX = {
    bip: function(){ tone(880, .06, 'square', 0, .12); tone(1320, .12, 'square', 1760, .18, .06); },
    bip2: function(){ SFX.bip(); tone(880, .06, 'square', 0, .12, .2); tone(1320, .12, 'square', 1760, .18, .26); },
    quack: function(){ tone(220, .18, 'sawtooth', 140, .14); },
    bup: function(){ tone(170, .14, 'sine', 40, .3); tone(90, .2, 'square', 30, .12); },
    crit: function(){ tone(170, .14, 'sine', 40, .3); tone(1200, .1, 'square', 2400, .1, .05); tone(1600, .12, 'square', 3200, .1, .12); },
    charge: function(){ tone(200, .5, 'sine', 900, .08); },
    hurt: function(){ tone(140, .3, 'sawtooth', 50, .18); },
    win: function(){ [523, 659, 784, 1046].forEach(function(f, i){ tone(f, .18, 'square', 0, .12, i * .12); }); },
    lose: function(){ [392, 330, 262].forEach(function(f, i){ tone(f, .3, 'triangle', 0, .15, i * .25); }); },
    phase: function(){ [262, 330, 392, 523, 659].forEach(function(f, i){ tone(f, .12, 'square', 0, .1, i * .08); }); },
    click: function(){ tone(600, .05, 'square', 0, .06); }
  };
  function vib(p){ try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

  /* ---------- helpers ---------- */
  function toast(msg){ var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('show'); }, 2400); }
  function copy(text, ok){
    function fallback(){ var ta = $('copyarea'); ta.value = text; ta.style.left = '0'; ta.focus(); ta.select(); var done = false; try { done = document.execCommand('copy'); } catch (e) {} ta.style.left = '-9999px'; toast(done ? ok : 'Không sao chép được, chụp màn hình để khoe nhé'); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){ toast(ok); }, fallback); else fallback();
  }
  function show(id){ ['s-title', 's-map', 's-result'].forEach(function(s){ $(s).hidden = s !== id; }); }
  function face(canvas, name, swap){ var c = canvas.getContext('2d'); c.clearRect(0, 0, canvas.width, canvas.height); var sz = spriteSize(name); var sc = Math.floor(Math.min(canvas.width / sz.w, canvas.height / sz.h)); drawSprite(c, name, Math.floor((canvas.width - sz.w * sc) / 2), canvas.height - Math.floor((canvas.height - sz.h * sc) / 2), sc, false, swap); }
  function avgOf(arr){ if (!arr.length) return 0; var s = 0; for (var i = 0; i < arr.length; i++) s += arr[i]; return Math.round(s / arr.length); }
  function gateName(n){ return 'Cửa ' + n + ' · ' + WORLDS[GATES[n - 1].w - 1].name; }
  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

  /* ---------- resize ---------- */
  function resize(){ DPR = Math.min(2, window.devicePixelRatio || 1); W = window.innerWidth; H = window.innerHeight; cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); GY = Math.floor(H * 0.68); SC = Math.max(4, Math.min(10, Math.floor(Math.min(W / 72, H / 110)))); }
  window.addEventListener('resize', resize); resize();

  /* ---------- title ---------- */
  function drawTitle(){
    var c = $('title-canvas'), x = c.getContext('2d'), w = c.width, h = c.height, gy = Math.floor(h * 0.78), t = performance.now() / 1000;
    drawBg(x, WORLDS[0], w, h, t, gy);
    drawSprite(x, HERO, w * 0.26, gy, 7, false);
    drawSprite(x, 'gabip', w * 0.47, gy - 10, 5, false);
    drawSprite(x, 'banoi', w * 0.62, gy, 6, true);
    x.fillStyle = 'rgba(255,210,63,.9)'; x.font = '900 22px ' + FF(); x.fillText('BỤP!', w * 0.36, gy - 125 + Math.sin(t * 4) * 4);
  }
  $('btn-play').addEventListener('click', function(){ sound(); SFX.click(); if (challenge) { startGate(challenge.gate); } else { renderMap(); show('s-map'); } });
  $('btn-story').addEventListener('click', function(){ var s = $('story'); if (s.hidden) { s.innerHTML = STORY.map(function(p){ return '<p>' + p + '</p>'; }).join(''); s.hidden = false; } else s.hidden = true; });
  $('btn-home').addEventListener('click', function(){ show('s-title'); });
  if (challenge) { var cb = $('challenge-banner'); cb.textContent = '🥊 Có người thách bạn ' + gateName(challenge.gate) + ' với phản xạ ' + challenge.ms + 'ms. Vượt được không?'; cb.hidden = false; $('btn-play').textContent = 'NHẬN THÁCH ĐẤU'; }

  /* ---------- map + hero select ---------- */
  function heroUnlocked(k){ return save.unlocked > HEROES[k].unlock; }
  function renderMap(){
    var all = save.hits, avg = avgOf(all), r = rankOf(avg || 9999);
    $('rank-name').textContent = r[1] + ' ' + r[2];
    var totalStars = 0; for (var k in save.stars) totalStars += save.stars[k];
    $('rank-sub').textContent = (all.length ? 'Phản xạ trung bình ' + avg + 'ms · ' : 'Chưa có dữ liệu phản xạ · ') + totalStars + '⭐ · ' + Math.min(save.unlocked - 1, GATES.length) + '/' + GATES.length + ' cửa';
    face($('rank-face'), HERO);
    var hh = '';
    Object.keys(HEROES).forEach(function(k){ var h = HEROES[k], un = heroUnlocked(k); hh += '<button type="button" class="hero' + (k === HERO ? ' on' : '') + (un ? '' : ' lock') + '" data-hero="' + k + '"' + (un ? '' : ' disabled') + '><canvas id="hf-' + k + '" width="42" height="54"></canvas>' + h.name + '<small>' + (un ? h.perk : '🔒 Qua cửa ' + h.unlock) + '</small></button>'; });
    $('heroes').innerHTML = hh;
    Object.keys(HEROES).forEach(function(k){ face($('hf-' + k), k); });
    Array.prototype.forEach.call(document.querySelectorAll('.hero[data-hero]'), function(b){ b.addEventListener('click', function(){ sound(); SFX.click(); HERO = b.getAttribute('data-hero'); save.hero = HERO; persist(); renderMap(); toast(HEROES[HERO].name + ': ' + HEROES[HERO].line); }); });
    var html = '';
    WORLDS.forEach(function(w){
      var first = GATES.findIndex(function(g){ return g.w === w.id; }) + 1, locked = first > save.unlocked;
      html += '<div class="world' + (locked ? ' need' : '') + '"><h3><span>' + w.id + '. ' + w.name + '</span><small>' + (locked ? 'Mở khi qua cửa ' + (first - 1) : w.sub) + '</small></h3><p class="mech">' + w.mech + '</p><div class="gates">';
      GATES.forEach(function(g, i){ if (g.w !== w.id) return; var n = i + 1, st = save.stars[n] || 0, lk = n > save.unlocked, cls = 'gate' + (lk ? ' lock' : '') + (ENEMIES[g.e].boss ? ' boss' : '') + (n === save.unlocked ? ' next' : '');
        html += '<button type="button" class="' + cls + '" data-gate="' + n + '"' + (lk ? ' disabled' : '') + '>' + (ENEMIES[g.e].boss ? (g.phases ? '👑' : '👹') : n) + '<span class="st">' + (st ? '★'.repeat(st) : (lk ? '🔒' : '')) + '</span></button>'; });
      html += '</div></div>';
    });
    $('worlds').innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll('.gate[data-gate]'), function(b){ b.addEventListener('click', function(){ sound(); SFX.click(); startGate(+b.getAttribute('data-gate')); }); });
  }
  $('btn-map').addEventListener('click', function(){ renderMap(); show('s-map'); });

  /* ---------- battle ---------- */
  var B = null, raf = 0, parts = [], fx = [], smoke = [];
  function startGate(n, opt){
    opt = opt || {};
    var g = GATES[n - 1], e = ENEMIES[g.e], w = WORLDS[g.w - 1], hs = HEROES[HERO];
    var ph = g.phases ? g.phases[0] : null;

    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#1a1026'; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx, y - bh, tw, bh, 10) : ctx.rect(bx, y - bh, tw, bh); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 6, y); ctx.lineTo(x + 6, y); ctx.lineTo(x, y + 8); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = col === '#fff' ? '#1a1026' : col; ctx.textAlign = 'center'; ctx.fillText(text, bx + tw / 2, y - bh * .3); ctx.textAlign = 'left';
  }

  /* ---------- result ---------- */
  var last = null;
  function showResult(won, stars, avg){
    var all = save.hits, r = rankOf(avgOf(all) || 9999);
    last = { won: won, stars: stars, avg: avg, gate: B.n, rank: r, practice: B.practice };
    $('res-stars').textContent = won ? '★'.repeat(stars) + '☆'.repeat(3 - stars) : '💀';
    var vs = '';
    if (challenge && challenge.gate === B.n) vs = won ? (avg < challenge.ms ? ' 🎉 Bạn THẮNG người thách (' + avg + 'ms < ' + challenge.ms + 'ms)!' : ' 😭 Thua người thách (' + challenge.ms + 'ms). Đánh lại đi!') : ' Người thách vẫn đang cười.';
    var newHero = won && !B.practice && Object.keys(HEROES).filter(function(k){ return HEROES[k].unlock === B.n; })[0];
    $('res-title').textContent = B.practice ? (won ? 'LUYỆN XONG, VÀO ĐÁNH THẬT' : 'LUYỆN TIẾP ĐI') : won ? (B.n === GATES.length ? 'THIÊN HẠ ĐỆ NHẤT BỤP!' : B.e.boss ? 'HẠ TRÙM ' + B.e.name.toUpperCase() + '!' : 'QUA ' + gateName(B.n).toUpperCase()) : 'THUA ' + B.e.name.toUpperCase();
    $('res-sub').textContent = (won ? (WIN_LINES[B.n] || 'Phản xạ trung bình ' + avg + 'ms. ' + (stars === 3 ? 'Hoàn hảo!' : stars === 2 ? 'Thiếu sao: cần dưới 250ms.' : 'Thiếu sao: đừng mất tim, và dưới 250ms.')) : pick(ENEMY_WIN_LINES) + (avg ? ' Phản xạ của bạn: ' + avg + 'ms.' : '')) + vs + (newHero ? ' 🎉 Mở nhân vật mới: ' + HEROES[newHero].name + '. Chọn ở bản đồ.' : '');
    $('btn-next').hidden = !won || B.practice || B.n >= GATES.length; $('btn-next').textContent = 'CỬA ' + (B.n + 1) + ' ▸';
    $('btn-practice').hidden = !(B.e.boss && (!won || B.practice));
    drawCard(won, stars, avg, r);
    try { $('btn-img').href = $('res-card').toDataURL('image/png'); } catch (e) {}
    var url = SHARE_URL + '#c' + B.n + '-' + (avg || 999);
    $('btn-fb').href = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url) + '&quote=' + encodeURIComponent(shareText());
    show('s-result');
  }
  function shareText(){ var l = last; return '🥊 BÁ KHÍ • ' + gateName(l.gate) + (l.won ? ' ✅ ' + '★'.repeat(l.stars) : ' ❌') + ' • ' + HEROES[HERO].name + '\n⚡ Phản xạ ' + (l.avg || '?') + 'ms • Cấp ' + l.rank[1] + ' ' + l.rank[2] + '\nThách bạn qua cửa này nhanh hơn tôi 👉 ' + SHARE_URL + '#c' + l.gate + '-' + (l.avg || 999); }
  function drawCard(won, stars, avg, r){
    var c = $('res-card'), x = c.getContext('2d'), w = c.width, h = c.height, gy = Math.floor(h * .72), ff = FF();
    drawBg(x, B.w, w, h, 3, gy);
    x.fillStyle = 'rgba(0,0,0,.35)'; x.fillRect(0, 0, w, h);
    drawSprite(x, HERO, w * .12, gy, 12, false);
    drawSprite(x, B.e.spr, w * .62, gy, 12, true, won ? { k: '#333', s: '#777', g: '#777', d: '#666', p: '#777', o: '#777', y: '#888', w: '#999', e: '#777', n: '#666', r: '#777', b: '#777', c: '#888', h: '#555', m: '#777', q: '#777', x: '#777', G: '#666' } : B.e.swap);
    if (won) { x.fillStyle = '#ff2e6e'; x.font = '900 60px ' + ff; x.save(); x.translate(w * .72, gy - 110); x.rotate(-.3); x.fillText('K.O.', 0, 0); x.restore(); }
    x.fillStyle = '#ffd23f'; x.font = '900 54px ' + ff; x.fillText('BÁ KHÍ', 40, 70); x.fillStyle = '#fff'; x.font = '800 22px ' + ff; x.fillText('BATTLE AURA', 44, 98);
    x.textAlign = 'right'; x.font = '900 34px ' + ff; x.fillText(gateName(B.n), w - 40, 64); x.font = '800 20px ' + ff; x.fillStyle = '#c6ff2e'; x.fillText(B.e.boss ? 'TRÙM: ' + B.e.name : 'vs ' + B.e.name, w - 40, 94); x.textAlign = 'left';
    x.fillStyle = 'rgba(11,11,22,.85)'; x.fillRect(0, h - 120, w, 120);
    x.fillStyle = won ? '#c6ff2e' : '#ff2e6e'; x.font = '900 44px ' + ff; x.fillText(won ? '★'.repeat(stars) + '☆'.repeat(3 - stars) + '  ' + (avg || '?') + 'ms' : 'THUA  ' + (avg ? avg + 'ms' : ''), 40, h - 62);
    x.fillStyle = '#fff'; x.font = '800 24px ' + ff; x.fillText(r[1] + ' ' + r[2] + '  ·  ' + HEROES[HERO].name, 40, h - 24);
    x.textAlign = 'right'; x.fillStyle = '#a7a8c6'; x.font = '800 20px ' + ff; x.fillText(SHARE_URL.replace(/^https?:\/\//, ''), w - 40, h - 24); x.textAlign = 'left';
  }
  $('btn-next').addEventListener('click', function(){ sound(); SFX.click(); challenge = null; startGate(Math.min(GATES.length, last.gate + 1)); });
  $('btn-retry').addEventListener('click', function(){ sound(); SFX.click(); startGate(last.gate); });
  $('btn-practice').addEventListener('click', function(){ sound(); SFX.click(); startGate(last.gate, { practice: true }); });
  $('btn-share').addEventListener('click', function(){ copy(shareText(), 'Đã sao chép! Dán vào Zalo, Messenger, FB…'); });
  $('btn-link').addEventListener('click', function(){ copy(SHARE_URL + '#c' + last.gate + '-' + (last.avg || 999), 'Đã sao chép link thách đấu cửa ' + last.gate + '!'); });

  (function tl(){ if (!$('s-title').hidden) drawTitle(); requestAnimationFrame(tl); })();
  window.__bakhi = { startGate: startGate, get: function(){ return B; }, save: save, signal: function(){ if (B) signal(performance.now()); }, tap: function(x, y){ tapDown(x === undefined ? (B && B.spot ? B.spot.x : W / 2) : x, y === undefined ? (B && B.spot ? B.spot.y : H / 2) : y); }, up: tapUp, setHero: function(k){ HERO = k; } };
})();
</script>
</body>
</html>
